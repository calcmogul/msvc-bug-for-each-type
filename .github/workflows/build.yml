name: Build

on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows cl
            os: windows-latest
          - name: Linux g++
            os: ubuntu-latest
          - name: macOS clang++
            os: macos-latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build -S .
      - run: cmake --build build
